<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonelB2840 · Perfil</title>
    <meta name="description" content="Perfil oficial de LeonelB2840 · Creador de contenido, desarrollador y fundador de Creators Sus Labs Studios.">
    <meta name="theme-color" content="#0b0f1c">

    <link rel="icon" href="https://github.com/leonelb2840-design.png">
    <link rel="apple-touch-icon" href="https://github.com/leonelb2840-design.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050a);
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            padding: 2rem 1.5rem;
            color: #e0ecff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(2px 2px at 85% 45%, #fff, transparent),
                radial-gradient(3px 3px at 30% 70%, #fff8, transparent),
                radial-gradient(2px 2px at 70% 15%, #fff, transparent),
                radial-gradient(3px 3px at 95% 80%, #fff6, transparent),
                radial-gradient(2px 2px at 45% 55%, #fff, transparent),
                radial-gradient(2px 2px at 5% 90%, #fff, transparent),
                radial-gradient(3px 3px at 60% 95%, #fff8, transparent);
            background-repeat: no-repeat;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 820px;
            width: 100%;
            background: rgba(8, 14, 28, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(90, 150, 255, 0.25);
            border-radius: 3rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(60, 130, 255, 0.1) inset;
        }

        /* Foto de perfil */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #5a9eff;
            box-shadow: 0 0 30px rgba(90, 158, 255, 0.6), 0 0 0 6px rgba(90, 158, 255, 0.15);
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
            background: #0b0f1c;
        }

        .profile-avatar:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #eef5ff;
            text-shadow: 0 0 20px #3e7eff;
            text-align: center;
        }

        /* Markdown renderizado */
        .markdown-body {
            color: #d0e2ff;
            font-size: 1rem;
            line-height: 1.7;
        }

        .markdown-body h1 {
            font-size: 2.2rem;
            color: #eef5ff;
            text-shadow: 0 0 20px #3e7eff, 0 0 5px #9ac0ff;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px dashed rgba(120, 170, 255, 0.3);
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            color: #8bb2ff;
            margin-top: 2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 0 10px rgba(90, 158, 255, 0.4);
        }

        .markdown-body h3 {
            font-size: 1.15rem;
            color: #b8d0ff;
            margin-top: 1.5rem;
            margin-bottom: 0.7rem;
        }

        .markdown-body p {
            color: #d0e2ff;
            margin-bottom: 1rem;
        }

        .markdown-body strong { color: #ffd966; }
        .markdown-body em { color: #b8d0ff; font-style: italic; }

        .markdown-body a {
            color: #8bb2ff;
            text-decoration: none;
            border-bottom: 1px dashed #3e7eff;
            transition: 0.2s;
        }

        .markdown-body a:hover {
            color: #ffd966;
            border-bottom-color: #ffd966;
        }

        .markdown-body ul {
            list-style: none;
            padding-left: 0;
            margin: 0.5rem 0 1rem 0;
        }

        .markdown-body ul li {
            color: #d0e2ff;
            padding: 0.3rem 0 0.3rem 1.6rem;
            position: relative;
            line-height: 1.6;
        }

        .markdown-body ul li::before {
            content: '▸';
            position: absolute;
            left: 0.3rem;
            color: #5a9eff;
            font-weight: 700;
        }

        .markdown-body hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #3e7eff, transparent);
            margin: 2rem 0;
            box-shadow: 0 0 10px #3e7eff;
        }

        .markdown-body code {
            background: rgba(90, 158, 255, 0.15);
            color: #ffd966;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .markdown-body blockquote {
            border-left: 5px solid #5a9eff;
            background: rgba(90, 158, 255, 0.08);
            border-radius: 0 1.2rem 1.2rem 0;
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            color: #b8d0ff;
            font-style: italic;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0.5rem 0;
        }

        /* Badges de shields.io */
        .markdown-body p:has(img[src*="shields.io"]) {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .markdown-body img[src*="shields.io"] {
            display: inline-block;
            margin: 0;
        }

        /* Centrar el div de "gracias" del final */
        .markdown-body div[align="center"] {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1f3350;
            color: #6b85aa;
            font-size: 0.9rem;
        }

        .markdown-body div[align="center"] p {
            color: #6b85aa;
        }

        /* Estado de carga */
        .loading {
            text-align: center;
            color: #8bb2ff;
            padding: 3rem 0;
            font-size: 1.1rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(90, 158, 255, 0.3);
            border-top-color: #5a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 0.8rem;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            color: #ffc0c0;
            text-align: center;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 2rem 1.5rem; border-radius: 2rem; }
            .profile-avatar { width: 100px; height: 100px; }
            .markdown-body h1 { font-size: 1.7rem; }
            .markdown-body h2 { font-size: 1.25rem; }
            .markdown-body p, .markdown-body ul li { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <img 
                src="https://github.com/leonelb2840-design.png" 
                alt="Foto de perfil de LeonelB2840" 
                class="profile-avatar"
                loading="lazy"
                onerror="this.style.display='none'"
            >
            <div class="profile-name">LeonelB2840</div>
        </div>

        <div id="content">
            <div class="loading">Cargando perfil</div>
        </div>
    </div>

    <script>
        (async () => {
            const content = document.getElementById('content');

            try {
                const response = await fetch('README.md');
                if (!response.ok) throw new Error('No se pudo cargar README.md');

                const markdown = await response.text();
                const html = marked.parse(markdown);

                content.innerHTML = `<div class="markdown-body">${html}</div>`;

                // Los enlaces externos se abren en nueva pestaña
                content.querySelectorAll('a').forEach(a => {
                    const href = a.getAttribute('href') || '';
                    if (href.startsWith('http')) {
                        a.setAttribute('target', '_blank');
                        a.setAttribute('rel', 'noopener noreferrer');
                    }
                });

            } catch (err) {
                console.error('Error cargando README:', err);
                content.innerHTML = `
                    <div class="error-msg">
                        ⚠️ No se pudo cargar el README.<br>
                        <small>${err.message}</small>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
